   name: Release

   on:
     push:
       tags: ["v*"]

   permissions:
     contents: write

   jobs:
     linux:
       runs-on: ubuntu-22.04
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install PySide6-Essentials pyinstaller
         - run: pyinstaller --noconfirm --windowed --name SlabCalc --add-data "assets:assets" main.py
         - run: tar -czf SlabCalc-${{ github.ref_name }}-linux-x64.tar.gz -C dist SlabCalc
         - uses: softprops/action-gh-release@v2
           with:
             files: SlabCalc-*-linux-x64.tar.gz